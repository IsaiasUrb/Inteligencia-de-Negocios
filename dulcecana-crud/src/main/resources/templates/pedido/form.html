<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Pedido · Dulce Caña</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
  <h1 th:text="${pedido.idPedido == null} ? 'Nuevo pedido' : 'Editar pedido'"></h1>
  <p class="subtitle">Completa los datos del pedido</p>

  <div class="card">
    <form class="form-grid" th:action="@{/pedidos/guardar}" th:object="${pedido}" method="post">
      <input type="hidden" th:field="*{idPedido}">

      <div class="field">
        <label for="fechaPedido">Fecha del pedido *</label>
        <input type="date" id="fechaPedido" th:field="*{fechaPedido}">
        <div class="error" th:if="${#fields.hasErrors('fechaPedido')}" th:errors="*{fechaPedido}"></div>
      </div>

      <div class="field">
        <label for="cliente">Cliente</label>
        <select id="cliente" th:field="*{cliente}">
          <option value="">— Sin asignar —</option>
          <option th:each="c : ${clientes}" th:value="${c.idCliente}" th:text="${c.nombre}"></option>
        </select>
      </div>

      <div class="field">
        <label for="total">Total</label>
        <input type="number" step="0.01" id="total" th:field="*{total}">
      </div>

      <div class="field">
        <label for="estado">Estado</label>
        <select id="estado" th:field="*{estado}">
          <option value="">— Selecciona —</option>
          <option value="Pendiente">Pendiente</option>
          <option value="En Proceso">En Proceso</option>
          <option value="Entregado">Entregado</option>
        </select>
        <div class="error" th:if="${errorEstado != null}" th:text="${errorEstado}"></div>
      </div>

      <div class="field full">
        <label for="metodoPago">Método de pago</label>
        <select id="metodoPago" th:field="*{metodoPago}">
          <option value="">— Selecciona —</option>
          <option value="Efectivo">Efectivo</option>
          <option value="Tarjeta">Tarjeta</option>
          <option value="Transferencia">Transferencia</option>
          <option value="Crédito">Crédito</option>
        </select>
      </div>

      <div class="form-actions">
        <button class="btn" type="submit">Guardar</button>
        <a class="btn secondary" href="/pedidos">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
