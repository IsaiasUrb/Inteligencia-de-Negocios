<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lotes de producción · Dulce Caña</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
  <div class="actions-bar">
    <div>
      <h1>Lotes de producción</h1>
      <p class="subtitle">Lotes producidos por cada proveedor</p>
    </div>
    <a class="btn" href="/lotes/nuevo">+ Nuevo lote</a>
  </div>

  <div class="card">
    <table th:if="${not #lists.isEmpty(lotes)}">
      <thead>
        <tr>
          <th>ID</th><th>Fecha producción</th><th>Kg</th><th>Estado</th><th>Proveedor</th><th></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="l : ${lotes}">
          <td th:text="${l.idLote}"></td>
          <td th:text="${l.fechaProduccion}"></td>
          <td th:text="${l.cantidadKg}"></td>
          <td><span class="badge" th:text="${l.estado}"></span></td>
          <td th:text="${l.proveedor != null ? l.proveedor.nombre : '—'}"></td>
          <td class="actions">
            <a class="btn secondary small" th:href="@{/lotes/editar/{id}(id=${l.idLote})}">Editar</a>
            <form th:action="@{/lotes/eliminar/{id}(id=${l.idLote})}" method="post"
                  onsubmit="return confirm('¿Eliminar este lote?');">
              <button class="btn danger small" type="submit">Eliminar</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="empty-state" th:if="${#lists.isEmpty(lotes)}">No hay lotes registrados todavía.</div>
  </div>
</main>
</body>
</html>
