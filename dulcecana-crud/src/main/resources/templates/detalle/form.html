<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalle de pedido · Dulce Caña</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
  <h1 th:text="${detalle.idDetalle == null} ? 'Nuevo detalle de pedido' : 'Editar detalle de pedido'"></h1>
  <p class="subtitle">Asocia un producto y una cantidad a un pedido</p>

  <div class="card">
    <div class="error" th:if="${errorPedido != null}" th:text="${errorPedido}" style="margin-bottom:16px"></div>
    <form class="form-grid" th:action="@{/detalles/guardar}" th:object="${detalle}" method="post">
      <input type="hidden" th:field="*{idDetalle}">

      <div class="field">
        <label for="pedido">Pedido *</label>
        <select id="pedido" th:field="*{pedido}">
          <option value="">— Selecciona —</option>
          <option th:each="p : ${pedidos}" th:value="${p.idPedido}"
                  th:text="'#' + ${p.idPedido} + ' · ' + ${p.fechaPedido}"></option>
        </select>
      </div>

      <div class="field">
        <label for="producto">Producto *</label>
        <select id="producto" th:field="*{producto}">
          <option value="">— Selecciona —</option>
          <option th:each="pr : ${productos}" th:value="${pr.idProducto}" th:text="${pr.nombreProducto}"></option>
        </select>
      </div>

      <div class="field">
        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" th:field="*{cantidad}">
      </div>

      <div class="field">
        <label for="precioUnitario">Precio unitario</label>
        <input type="number" step="0.01" id="precioUnitario" th:field="*{precioUnitario}">
      </div>

      <div class="field">
        <label for="subtotal">Subtotal</label>
        <input type="number" step="0.01" id="subtotal" th:field="*{subtotal}">
      </div>

      <div class="form-actions">
        <button class="btn" type="submit">Guardar</button>
        <a class="btn secondary" href="/detalles">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
