<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Detalle de pedidos · Dulce Caña</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
  <div class="actions-bar">
    <div>
      <h1>Detalle de pedidos</h1>
      <p class="subtitle">Productos y cantidades de cada pedido</p>
    </div>
    <a class="btn" href="/detalles/nuevo">+ Nuevo detalle</a>
  </div>

  <div class="card">
    <table th:if="${not #lists.isEmpty(detalles)}">
      <thead>
        <tr>
          <th>ID</th><th>Pedido</th><th>Producto</th><th>Cantidad</th><th>Precio unit.</th><th>Subtotal</th><th></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="d : ${detalles}">
          <td th:text="${d.idDetalle}"></td>
          <td th:text="${d.pedido != null ? '#' + d.pedido.idPedido : '—'}"></td>
          <td th:text="${d.producto != null ? d.producto.nombreProducto : '—'}"></td>
          <td th:text="${d.cantidad}"></td>
          <td th:text="${d.precioUnitario}"></td>
          <td th:text="${d.subtotal}"></td>
          <td class="actions">
            <a class="btn secondary small" th:href="@{/detalles/editar/{id}(id=${d.idDetalle})}">Editar</a>
            <form th:action="@{/detalles/eliminar/{id}(id=${d.idDetalle})}" method="post"
                  onsubmit="return confirm('¿Eliminar este detalle?');">
              <button class="btn danger small" type="submit">Eliminar</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="empty-state" th:if="${#lists.isEmpty(detalles)}">No hay detalles de pedido registrados todavía.</div>
  </div>
</main>
</body>
</html>
