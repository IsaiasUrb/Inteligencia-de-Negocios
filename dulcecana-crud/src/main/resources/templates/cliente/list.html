<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Clientes · Dulce Caña</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
  <div class="actions-bar">
    <div>
      <h1>Clientes</h1>
      <p class="subtitle">Clientes registrados</p>
    </div>
    <a class="btn" href="/clientes/nuevo">+ Nuevo cliente</a>
  </div>

  <div class="card">
    <table th:if="${not #lists.isEmpty(clientes)}">
      <thead>
        <tr>
          <th>ID</th><th>Nombre</th><th>Tipo</th><th>Ciudad</th><th>Correo</th><th>Activo</th><th></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="c : ${clientes}">
          <td th:text="${c.idCliente}"></td>
          <td th:text="${c.nombre}"></td>
          <td><span class="badge" th:text="${c.tipoCliente}"></span></td>
          <td th:text="${c.ciudad}"></td>
          <td th:text="${c.correo}"></td>
          <td th:text="${c.activo != null and c.activo} ? 'Sí' : 'No'"></td>
          <td class="actions">
            <a class="btn secondary small" th:href="@{/clientes/editar/{id}(id=${c.idCliente})}">Editar</a>
            <form th:action="@{/clientes/eliminar/{id}(id=${c.idCliente})}" method="post"
                  onsubmit="return confirm('¿Eliminar este cliente?');">
              <button class="btn danger small" type="submit">Eliminar</button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="empty-state" th:if="${#lists.isEmpty(clientes)}">No hay clientes registrados todavía.</div>
  </div>
</main>
</body>
</html>
