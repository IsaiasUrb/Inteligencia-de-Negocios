<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Producto · Dulce Caña</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
  <h1 th:text="${producto.idProducto == null} ? 'Nuevo producto' : 'Editar producto'"></h1>
  <p class="subtitle">Completa los datos del producto</p>

  <div class="card">
    <form class="form-grid" th:action="@{/productos/guardar}" th:object="${producto}" method="post">
      <input type="hidden" th:field="*{idProducto}">

      <div class="field full">
        <label for="nombreProducto">Nombre *</label>
        <input type="text" id="nombreProducto" th:field="*{nombreProducto}">
        <div class="error" th:if="${#fields.hasErrors('nombreProducto')}" th:errors="*{nombreProducto}"></div>
      </div>

      <div class="field full">
        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" th:field="*{descripcion}"></textarea>
      </div>

      <div class="field">
        <label for="tipoProducto">Tipo de producto</label>
        <input type="text" id="tipoProducto" th:field="*{tipoProducto}" placeholder="ej. Panela, Azúcar, Melaza">
      </div>

      <div class="field">
        <label for="precio">Precio</label>
        <input type="number" step="0.01" id="precio" th:field="*{precio}">
      </div>

      <div class="field">
        <label for="stock">Stock</label>
        <input type="number" id="stock" th:field="*{stock}">
      </div>

      <div class="field">
        <label for="lote">Lote de origen</label>
        <select id="lote" th:field="*{lote}">
          <option value="">— Sin asignar —</option>
          <option th:each="l : ${lotes}" th:value="${l.idLote}"
                  th:text="'#' + ${l.idLote} + ' · ' + ${l.fechaProduccion}"></option>
        </select>
      </div>

      <div class="form-actions">
        <button class="btn" type="submit">Guardar</button>
        <a class="btn secondary" href="/productos">Cancelar</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
