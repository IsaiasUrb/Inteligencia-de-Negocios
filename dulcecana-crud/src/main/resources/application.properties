# Conexion a la base de datos local (la misma que usa pgAdmin / el conector MCP)
spring.datasource.url=jdbc:postgresql://localhost:5432/dulcecana_db
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Las tablas YA EXISTEN en la base (creadas por el dump) -> Hibernate NUNCA debe crearlas ni modificarlas.
# "validate" solo verifica que las entidades coincidan con las tablas reales; no toca el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# true (el default de Spring Boot): mantiene la sesion de Hibernate abierta mientras se
# renderiza la plantilla, para que las relaciones @ManyToOne perezosas (proveedor, cliente, etc.)
# se puedan leer directamente en las vistas de listado sin lanzar LazyInitializationException.
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

server.port=8087

# Nombre de la app (solo informativo)
spring.application.name=dulcecana-crud
